name: xm

volumes:
  pgdata:

services:
  proxy:
    image: nginx:stable-alpine3.24
    container_name: proxy
    ports:
      - "80:80"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    depends_on:
      - web

  web:
    container_name: web
    build:
      context: ./../../
      dockerfile: build/package/Dockerfile
    environment:
      APP_NAME: "XM-golang-exercise"
      APP_VERSION: 1.0.0
      LISTEN_ADDR_HTTP: ":8000"
      PG_DSN: "postgres://user:pass@db:5432/xm"
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:18-alpine3.24
    container_name: db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: xm
      JWT_SECRET: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./pg.sql:/docker-entrypoint-initdb.d/init.sql
